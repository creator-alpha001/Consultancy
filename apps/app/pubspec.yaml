name: sankalp_app
description: Sankalp — the native client, for seekers and for providers.
publish_to: 'none'

# Bumped by the release job, not by hand.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Kept alphabetical: the `sort_pub_dependencies` lint enforces it, which
# is worth having on a list that only ever grows.
dependencies:
  agora_rtc_engine: ^6.6.4
  cupertino_icons: ^1.0.8
  # Interceptors are the reason for dio over package:http — the bearer
  # token, the idempotency key, the error envelope and the retry budget
  # each become one place rather than a rule every call site remembers.
  dio: ^5.11.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # The session token lives in the platform keystore. See
  # lib/session/token_store.dart for why this is not negotiable.
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Bundled, never fetched (no google_fonts): a font download on a patchy
  # network is a blank screen. lib/theme/script.dart picks the family per
  # string, because Inter has no Devanagari coverage and a Hindi label set
  # in Inter renders as tofu. Inter 4.1 (rsms/inter) and Noto Sans
  # Devanagari 2.007 (notofonts, hinted), both SIL OFL — licences sit
  # beside the files.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
