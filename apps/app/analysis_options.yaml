include: package:flutter_lints/flutter.yaml

# Strict, in the same spirit as the API's `"strict": true` tsconfig and
# CLAUDE.md's "no `any`, no non-null assertions on external data".
#
# The three `strict-*` flags below are the Dart equivalent of that line.
# `strict-casts` in particular is the one that matters here: without it,
# `dynamic` from a decoded JSON body flows into typed code silently, and
# a field the API renamed becomes a null at the point of USE rather than
# an error at the point of PARSE. Every model in this app parses
# explicitly for that reason.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Generated code is not hand-maintained; a lint on it is noise that
    # trains people to ignore lints.
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
